<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #e5ddd5; height: 100vh; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; }
    .bubble-row { display: flex; margin-bottom: 8px; width: 100%; }
    .bubble-row.mine { justify-content: flex-end; }
    .bubble { max-width: 75%; background: #fff; padding: 8px 10px; border-radius: 7.5px; position: relative; font-size: 14px; word-wrap: break-word; }
    .mine .bubble { background: #dcf8c6; }
    .sticker-bubble { background: transparent !important; box-shadow: none !important; padding: 0 !important; }
    .sticker-image { max-width: 150px; max-height: 150px; display: block; }
    .photo { max-width: 100%; border-radius: 5px; display: block; margin-bottom: 5px; }
    .time { font-size: 10px; color: #999; float: right; margin-left: 10px; margin-top: 4px; }
    .empty { text-align: center; color: #777; margin-top: 20px; font-size: 14px; }
    .audio-box { display: flex; flex-direction: column; gap: 4px; }
    .audio-fallback-btn { font-size: 11px; color: #075e54; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div id="messages"></div>

  <script>
    // Utilitários legados para compatibility total com ES5 (Android 4.4.2)
    function $(id) { return document.getElementById(id); }
    
    function esc(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTime(ts) {
      if (!ts) return "";
      var d = new Date(Number(ts));
      var h = d.getHours();
      var m = d.getMinutes();
      return (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m);
    }

    // Variáveis globais de estado da aplicação (exemplo de estrutura)
    var S = {
      data: {},
      uid: "user_1",
      conv: "group_1",
      lastSeen: 0
    };
    var GROUP_ID = "group_1";
    var USERS = {};

    function notify(m) {
      // Implementação da notificação
    }

    // Função de Renderização corrigida e compatível com Android KitKat
    function render(old) {
      var box = $("messages");
      var wasNearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 80;
      var previousHeight = box.scrollHeight;
      var previousTop = box.scrollTop;
      
      var keys = [];
      var k;
      for (k in S.data) {
        if (S.data.hasOwnProperty(k)) {
          keys.push(k);
        }
      }

      keys.sort(function(a, b) {
        return (Number(S.data[a].timestamp) || 0) - (Number(S.data[b].timestamp) || 0);
      });

      var h = "";
      for (var i = 0; i < keys.length; i++) {
        var m = S.data[keys[i]];
        var mine = m.senderId === S.uid;
        var senderName = USERS[m.senderId] ? USERS[m.senderId].name : "Usuário";

        if (m.type === "sticker") {
          // Correção do Bug: Acumula no 'h' sem sobrescrever nem usar 'continue'
          h += '<div class="bubble-row ' + (mine ? 'mine' : '') + '"><div class="bubble sticker-bubble">';
          if (!mine && S.conv === GROUP_ID) {
            h += '<div style="font-size:11px;font-weight:bold;color:#075e54;margin-bottom:3px">' + esc(senderName) + '</div>';
          }
          h += '<img class="sticker-image" src="' + esc(m.url) + '" alt="Sticker">';
          h += '<span class="time">' + formatTime(m.timestamp) + '</span></div></div>';
        } else {
          h += '<div class="bubble-row ' + (mine ? 'mine' : '') + '"><div class="bubble">';
          if (!mine && S.conv === GROUP_ID) {
            h += '<div style="font-size:11px;font-weight:bold;color:#075e54;margin-bottom:3px">' + esc(senderName) + '</div>';
          }

          if (m.type === "image") {
            h += '<a href="' + esc(m.url) + '" target="_blank"><img class="photo" src="' + esc(m.url) + '"></a>';
          } else if (m.type === "audio") {
            h += '<div class="audio-box">';
            h += '<audio class="audio" controls preload="metadata" src="' + esc(m.url) + '"></audio>';
            h += '<a href="' + esc(m.url) + '" target="_blank" class="audio-fallback-btn">▶ Ouvir / Baixar Áudio</a>';
            h += '</div>';
          } else {
            h += esc(m.text || "");
          }

          h += '<span class="time">' + formatTime(m.timestamp) + '</span></div></div>';
        }
      }

      box.innerHTML = h || '<div class="empty">Nenhuma mensagem ainda.</div>';

      if (wasNearBottom) {
        box.scrollTop = box.scrollHeight;
      } else {
        box.scrollTop = previousTop + (box.scrollHeight - previousHeight);
      }

      var newest = keys.length ? Number(S.data[keys[keys.length - 1]].timestamp) : 0;
      if (old && newest > S.lastSeen) {
        var m2 = S.data[keys[keys.length - 1]];
        if (m2.senderId !== S.uid) {
          notify(m2);
        }
      }
      S.lastSeen = Math.max(S.lastSeen, newest);
    }
  </script>
</body>
</html>
