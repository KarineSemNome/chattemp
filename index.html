<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#075e54">
<title>Chat Temporário</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#efe7dd;color:#222}
button,input{font:inherit}
.hidden{display:none!important}

#login{height:100%;display:flex;align-items:center;justify-content:center;background:#075e54;padding:18px}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:10px;padding:24px;box-shadow:0 3px 14px #0004}
.login-card h1{margin:0 0 6px;color:#075e54}
.login-card p{margin:0 0 18px;color:#666}
.login-card input{width:100%;height:46px;margin:6px 0;padding:0 12px;border:1px solid #bbb;border-radius:7px}
.login-card button{width:100%;height:46px;margin-top:8px;border:0;border-radius:7px;background:#075e54;color:#fff;font-weight:bold}
.error{color:#b00020;margin-top:10px;font-size:13px}

/* Ajustes de Layout para Teclado Virtual / Mobile */
#app{position:fixed;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column}
.top{height:58px;background:#075e54;color:#fff;display:flex;align-items:center;padding:0 12px;flex-shrink:0}
.brand{font-size:19px;font-weight:bold;flex:1}
.me{font-size:13px;margin-right:10px;color:#d7eeeb}
.top button,.top input[type=color]{background:#064f48;color:#fff;border:0;border-radius:6px;padding:6px 8px;margin-left:4px;cursor:pointer}
.top input[type=color]{width:34px;height:32px;padding:0;border:1px solid #ffffff44}

.body{display:flex;flex:1;min-height:0}
.side{width:250px;background:#fff;border-right:1px solid #ccc;padding:8px;overflow-y:auto}
.person{width:100%;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left;padding:13px 10px;font-weight:bold}
.person.active{background:#e8f5f3}
.person small{display:block;color:#888;font-weight:normal;margin-top:3px}

.chat{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.chatbar{height:52px;background:#f0f2f5;border-bottom:1px solid #ccc;display:flex;align-items:center;padding:0 10px;font-weight:bold;flex-shrink:0}
.chatbar .name{flex:1}
.chatbar button{border:0;background:transparent;color:#555;font-size:13px}

.messages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;background:#efe7dd}
.bubble-row{display:flex;margin:4px 0}
.bubble-row.mine{justify-content:flex-end}
.bubble{max-width:82%;padding:7px 9px;border-radius:8px;background:#fff;box-shadow:0 1px 1px #0002;word-wrap:break-word;white-space:pre-wrap}
.mine .bubble{background:#dcf8c6}
.time{font-size:10px;color:#777;float:right;margin:8px 0 0 8px}
.photo{max-width:300px;width:100%;display:block;border-radius:6px}
.audio{width:260px;max-width:100%;height:38px}

.composer{background:#f0f2f5;padding:7px;display:flex;align-items:center;flex-shrink:0}
.iconbtn{width:42px;height:42px;border:0;border-radius:50%;background:#fff;font-size:20px;margin-right:6px}
.composer input[type=text]{flex:1;height:42px;border:0;border-radius:21px;padding:0 14px;min-width:0;margin-right:6px}
.send{width:72px;height:42px;border:0;border-radius:21px;background:#075e54;color:#fff;font-weight:bold}

.recording{font-size:12px;color:#b00020;padding:4px 10px;background:#f0f2f5}
.status{height:18px;background:#f0f2f5;color:#777;font-size:10px;padding-left:12px}
.empty{text-align:center;color:#777;margin-top:30px}
.date{font-size:10px;color:#888;margin-bottom:3px}

@media(max-width:650px){
  .side{width:110px;padding:4px}
  .person{font-size:12px;padding:8px 4px}
  .me{display:none}
  .bubble{max-width:90%}
  .send{width:58px}
}
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <h1>ChatTemp</h1>
    <p>Conversa privada</p>
    <input id="email" placeholder="E-mail" autocomplete="off">
    <input id="pass" type="password" placeholder="Senha">
    <button id="loginBtn">Entrar</button>
    <div id="err" class="error"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top">
    <div class="brand">ChatTemp</div>
    <div id="me" class="me"></div>
    <input type="color" id="colorPicker" value="#efe7dd" title="Cor do Chat">
    <button id="logout">Sair</button>
  </div>
  <div class="body">
    <div id="side" class="side"></div>
    <div class="chat">
      <div class="chatbar">
        <div id="chatName" class="name">Selecione uma conversa</div>
        <button id="clearBtn" class="hidden">Limpar</button>
      </div>
      <div id="messages" class="messages">
        <div class="empty">Escolha uma conversa.</div>
      </div>
      <div id="status" class="status"></div>
      <div id="rec" class="recording hidden">● Gravando áudio... clique novamente para parar</div>
      <div class="composer">
        <button id="photoBtn" class="iconbtn" title="Foto">📎</button>
        <input id="file" type="file" accept="image/*" class="hidden">
        <button id="micBtn" class="iconbtn" title="Gravar áudio">🎤</button>
        <input id="text" type="text" placeholder="Mensagem" maxlength="2000">
        <button id="send" class="send">Enviar</button>
      </div>
    </div>
  </div>
</div>

<audio id="notificationSound" preload="auto">
  <source src="notificacao.mp3" type="audio/mpeg">
</audio>

<script>
var FIREBASE_API_KEY="AIzaSyDLqp4ieS3LqeJhHYLud1UjqtR7_5W8QfA";
var FIREBASE_DATABASE_URL="https://chat-temporario-b83d1-default-rtdb.firebaseio.com";
var SUPABASE_URL="https://dvmaiospgekqfiwkhcfh.supabase.co";
var SUPABASE_ANON_KEY="sb_publishable_ZauMz8gxsvsJUiC9Eqee-w_GFGMc-C2";
var USERS={"ZwESBVxjszRqPiOy9dDhx7rRmUK2":{name:"USER 1"},"rN0rwjdIxUV7ov3pbNWe745i7VE3":{name:"Nathan"},"qncO2nyU7id0Z6Oa3GXsgZ3udH92":{name:"Marly"}};
var S={token:null,refresh:null,uid:null,conv:null,other:null,data:{},timer:null,lastSeen:0,recording:false,rec:null,chunks:[],ready:false};

function $(x){return document.getElementById(x)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}

function api(url,opt,cb){
  var x=new XMLHttpRequest();
  x.open(opt.method||"GET",url,true);
  if(opt.body!==undefined)x.setRequestHeader("Content-Type","application/json");
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    var d=null;
    try{d=x.responseText?JSON.parse(x.responseText):null}catch(e){}
    cb(x.status,d,x.responseText);
  };
  x.send(opt.body!==undefined?(opt.body===null?null:JSON.stringify(opt.body)):null);
}

function login(){
  var e=$("email").value.replace(/^\s+|\s+$/g,"");
  var p=$("pass").value;
  $("err").innerHTML="";
  if(e.toLowerCase()==="usuario@chat.com")e="usuário@chat.local";
  var u="https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(FIREBASE_API_KEY);
  api(u,{method:"POST",body:{email:e,password:p,returnSecureToken:true}},function(st,d){
    if(st!==200||!d||!USERS[d.localId]){$("err").innerHTML="E-mail ou senha inválidos.";return}
    S.token=d.idToken;
    S.refresh=d.refreshToken;
    S.uid=d.localId;
    localStorage.chatT=S.token;
    localStorage.chatR=S.refresh;
    localStorage.chatU=S.uid;
    openApp();
    requestNotify();
  });
}

function openApp(){
  $("login").className="hidden";
  $('app').className="";
  $('me').innerHTML=esc(USERS[S.uid].name);
  applySavedBgColor();
  buildSide();
}

function buildSide(){
  var ids=S.uid==="ZwESBVxjszRqPiOy9dDhx7rRmUK2"?["qncO2nyU7id0Z6Oa3GXsgZ3udH92","rN0rwjdIxUV7ov3pbNWe745i7VE3"]:["ZwESBVxjszRqPiOy9dDhx7rRmUK2"];
  var h="";
  for(var i=0;i<ids.length;i++)h+='<button class="person" data-id="'+ids[i]+'">'+esc(USERS[ids[i]].name)+'<small>Conversa privada</small></button>';
  $('side').innerHTML=h;
  var bs=$('side').getElementsByTagName('button');
  for(var j=0;j<bs.length;j++){
    bs[j].onclick=function(){select(this.getAttribute('data-id'),this);};
  }
}

function select(other,b){
  var mine="ZwESBVxjszRqPiOy9dDhx7rRmUK2";
  S.other=other;
  S.conv=(S.uid===mine?(other==="qncO2nyU7id0Z6Oa3GXsgZ3udH92"?"user1_marly":"user1_nathan"):(S.uid==="qncO2nyU7id0Z6Oa3GXsgZ3udH92"?"user1_marly":"user1_nathan"));
  var bs=$('side').getElementsByTagName('button');
  for(var i=0;i<bs.length;i++)bs[i].className="person";
  b.className="person active";
  $('chatName').innerHTML=esc(USERS[other].name);
  $('clearBtn').className="";
  S.lastSeen=Date.now();
  load();
  if(S.timer)clearInterval(S.timer);
  S.timer=setInterval(load,2000);
}

function dbUrl(){return FIREBASE_DATABASE_URL+"/chat/"+S.conv+"/messages.json?auth="+encodeURIComponent(S.token)}

function load(){
  if(!S.conv)return;
  api(dbUrl(),{method:"GET"},function(st,d){
    if(st===401){refreshToken();return}
    if(st!==200)return;
    var old=S.data;
    S.data=d||{};
    render(old);
  });
}

function render(old){
  var box=$("messages"),wasNearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  var previousHeight=box.scrollHeight,previousTop=box.scrollTop;
  var keys=[],k;
  for(k in S.data)if(S.data.hasOwnProperty(k))keys.push(k);
  keys.sort(function(a,b){return (Number(S.data[a].timestamp)||0)-(Number(S.data[b].timestamp)||0)});
  var h="";
  for(var i=0;i<keys.length;i++){
    var m=S.data[keys[i]],mine=m.senderId===S.uid;
    h+='<div class="bubble-row '+(mine?'mine':'')+'"><div class="bubble">';
    if(m.type==="image")h+='<a href="'+esc(m.url)+'" target="_blank"><img class="photo" src="'+esc(m.url)+'"></a>';
    else if(m.type==="audio")h+='<audio class="audio" controls src="'+esc(m.url)+'"></audio>';
    else h+=esc(m.text||"");
    h+='<span class="time">'+formatTime(m.timestamp)+'</span></div></div>';
  }
  box.innerHTML=h||'<div class="empty">Nenhuma mensagem ainda.</div>';
  if(wasNearBottom){box.scrollTop=box.scrollHeight;}
  else{box.scrollTop=previousTop+(box.scrollHeight-previousHeight);}
  var newest=keys.length?Number(S.data[keys[keys.length-1]].timestamp):0;
  if(old&&newest>S.lastSeen){
    var m2=S.data[keys[keys.length-1]];
    if(m2.senderId!==S.uid)notify(m2);
  }
  S.lastSeen=Math.max(S.lastSeen,newest);
}

function formatTime(ts){
  var d=new Date(Number(ts)||Date.now()),h=d.getHours(),m=d.getMinutes();
  return (h<10?"0":"")+h+":"+(m<10?"0":"")+m;
}

function notify(m){
  $('status').innerHTML="Nova mensagem";
  try{
    var a=$('notificationSound');
    a.currentTime=0;
    var pr=a.play();
    if(pr&&pr.catch)pr.catch(function(){});
  }catch(e){}
  if(window.Notification&&Notification.permission==="granted")try{
    new Notification("ChatTemp - "+USERS[S.other].name,{body:m.type==="image"?"📷 Foto":m.type==="audio"?"🎤 Áudio":m.text||"Nova mensagem"});
  }catch(e){}
}

function sendMsg(m){
  api(dbUrl(),{method:"POST",body:m},function(st){
    if(st===401){refreshToken();return}
    if(st===200){$('text').value="";load();}else $('status').innerHTML="Não foi possível enviar.";
  });
}

function sendText(){
  var t=$('text').value.replace(/^\s+|\s+$/g,"");
  if(t)sendMsg({senderId:S.uid,text:t,type:"text",timestamp:Date.now()});
}

function uploadFile(f){
  if(!f||!S.conv)return;
  if(f.size>50*1024*1024){$('status').innerHTML="Arquivo acima de 50 MB.";return}
  var ext=(f.name.split('.').pop()||"bin").replace(/[^a-zA-Z0-9]/g,"");
  var path=S.conv+"/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext;
  var url=SUPABASE_URL+"/storage/v1/object/chat-media/"+path;
  var x=new XMLHttpRequest();
  x.open("POST",url,true);
  x.setRequestHeader("Authorization","Bearer "+SUPABASE_ANON_KEY);
  x.setRequestHeader("apikey",SUPABASE_ANON_KEY);
  x.setRequestHeader("Content-Type",f.type||"application/octet-stream");
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status>=200&&x.status<300){
      var publicUrl=SUPABASE_URL+"/storage/v1/object/public/chat-media/"+path;
      sendMsg({senderId:S.uid,type:f.type.indexOf("image/")===0?"image":"audio",url:publicUrl,text:"",timestamp:Date.now()});
    }else $('status').innerHTML="Erro no upload. O bucket chat-media precisa permitir upload.";
  };
  x.send(f);
}

function startRecord(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $('status').innerHTML="Seu navegador não permite gravação de áudio.";
    return;
  }
  if(S.recording){stopRecord();return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    S.recording=true;
    $('rec').className="recording";
    var opts={};
    try{opts={mimeType:"audio/webm"};}catch(e){}
    try{S.rec=new MediaRecorder(stream,opts);}catch(e){S.rec=new MediaRecorder(stream);}
    S.chunks=[];
    S.rec.ondataavailable=function(e){if(e.data&&e.data.size)S.chunks.push(e.data);};
    S.rec.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});
      var blob=new Blob(S.chunks,{type:S.rec.mimeType||"audio/webm"});
      var file=new File([blob],"audio_"+Date.now()+".webm",{type:blob.type});
      uploadFile(file);
      S.recording=false;
      $('rec').className="recording hidden";
    };
    S.rec.start();
  }).catch(function(){$('status').innerHTML="Permissão para microfone recusada.";});
}

function stopRecord(){if(S.rec&&S.recording)S.rec.stop();}

function clearChat(){
  if(!S.conv)return;
  if(!confirm("Apagar toda esta conversa para os dois usuários?"))return;
  var x=new XMLHttpRequest();
  x.open("DELETE",dbUrl(),true);
  x.onreadystatechange=function(){
    if(x.readyState===4){
      if(x.status===200){
        S.data={};
        $('messages').innerHTML='<div class="empty">Nenhuma mensagem ainda.</div>';
      }else $('status').innerHTML="Não foi possível limpar.";
    }
  };
  x.send();
}

function requestNotify(){
  if(window.Notification&&Notification.permission==="default")try{Notification.requestPermission();}catch(e){}
}

function refreshToken(){
  if(!S.refresh)return;
  var u="https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(FIREBASE_API_KEY);
  var x=new XMLHttpRequest();
  x.open("POST",u,true);
  x.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status!==200){logout();return}
    var d;
    try{d=JSON.parse(x.responseText)}catch(e){logout();return}
    S.token=d.id_token;
    S.refresh=d.refresh_token||S.refresh;
    localStorage.chatT=S.token;
    localStorage.chatR=S.refresh;
  };
  x.send("grant_type=refresh_token&refresh_token="+encodeURIComponent(S.refresh));
}

function logout(){
  if(S.timer)clearInterval(S.timer);
  localStorage.removeItem("chatT");
  localStorage.removeItem("chatR");
  localStorage.removeItem("chatU");
  location.reload();
}

/* Troca de Cor do Chat */
function applySavedBgColor(){
  var bg = localStorage.chatBgColor || "#efe7dd";
  $('messages').style.backgroundColor = bg;
  $('colorPicker').value = bg;
}

$('colorPicker').onchange = function(){
  var color = this.value;
  $('messages').style.backgroundColor = color;
  localStorage.chatBgColor = color;
};

/* Ajustes de foco para manter o input visível em navegadores antigos (Android 4.4.2) */
$('text').addEventListener('focus', function(){
  setTimeout(function(){
    window.scrollTo(0, 0);
    var box = $('messages');
    box.scrollTop = box.scrollHeight;
  }, 300);
});

$('loginBtn').onclick=login;
$('pass').onkeydown=function(e){if((e||window.event).keyCode===13)login()};
$('send').onclick=sendText;
$('text').onkeydown=function(e){if((e||window.event).keyCode===13){sendText();return false}};
$('photoBtn').onclick=function(){if(S.conv)$('file').click()};
$('file').onchange=function(){if(this.files&&this.files[0])uploadFile(this.files[0]);this.value=""};
$('micBtn').onclick=startRecord;
$('clearBtn').onclick=clearChat;
$('logout').onclick=logout;
document.body.addEventListener('click',requestNotify,{once:true});

try{
  if(localStorage.chatT&&localStorage.chatU&&USERS[localStorage.chatU]){
    S.token=localStorage.chatT;
    S.refresh=localStorage.chatR;
    S.uid=localStorage.chatU;
    openApp();
  }
}catch(e){}
</script>
</body>
</html>
