<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#075e54">
<title>Whatsapp 2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#efe7dd;color:#222}
button,input{font:inherit}
.hidden{display:none!important}

#login{height:100%;display:flex;align-items:center;justify-content:center;background:#075e54;padding:18px}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:10px;padding:24px;box-shadow:0 3px 14px #0004}
.login-card h1{margin:0 0 6px;color:#075e54}
.login-card p{margin:0 0 18px;color:#666}
.login-card input{width:100%;height:46px;margin:6px 0;padding:0 12px;border:1px solid #bbb;border-radius:7px;color:#000;background:#fff}
.login-card button{width:100%;height:46px;margin-top:8px;border:0;border-radius:7px;background:#075e54;color:#fff;font-weight:bold}
.error{color:#b00020;margin-top:10px;font-size:13px}

/* Layout App */
#app{position:fixed;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column}
.top{height:58px;background:#075e54;color:#fff;display:flex;align-items:center;padding:0 8px;flex-shrink:0}
.brand{font-size:18px;font-weight:bold;flex:1}
.me{font-size:12px;margin-right:6px;color:#d7eeeb}

/* Seletores de Cor */
.color-group{display:flex;align-items:center;margin-right:6px}
.color-group label{font-size:10px;margin-right:2px;color:#fff}
.top input[type=color]{width:28px;height:28px;padding:0;border:1px solid #ffffff66;background:transparent;cursor:pointer;border-radius:4px}
.top button{background:#064f48;color:#fff;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12px}

.body{display:flex;flex:1;min-height:0}
.side{width:250px;background:#fff;border-right:1px solid #ccc;padding:8px;overflow-y:auto}
.person{width:100%;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left;padding:13px 10px;font-weight:bold;cursor:pointer}
.person.active{background:#e8f5f3}
.person small{display:block;color:#888;font-weight:normal;margin-top:3px}

.chat{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.chatbar{height:52px;background:#f0f2f5;border-bottom:1px solid #ccc;display:flex;align-items:center;padding:0 10px;font-weight:bold;flex-shrink:0}
.chatbar .name{flex:1}
.chatbar button{border:0;background:transparent;color:#555;font-size:13px}

.messages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;background:#efe7dd}
.bubble-row{display:flex;margin:4px 0}
.bubble-row.mine{justify-content:flex-end}
.bubble{max-width:82%;padding:7px 9px;border-radius:8px;background:#fff;box-shadow:0 1px 1px #0002;word-wrap:break-word;white-space:pre-wrap}
.mine .bubble{background:#dcf8c6}

.time{font-size:10px;color:#777;float:right;margin:8px 0 0 8px}
.photo{max-width:300px;width:100%;display:block;border-radius:6px}
.audio-box{display:flex;flex-direction:column;gap:4px;min-width:220px}
.audio{width:100%;height:40px}
.audio-fallback-btn{display:inline-block;padding:6px 10px;background:#075e54;color:#fff;text-decoration:none;border-radius:4px;font-size:12px;text-align:center;font-weight:bold;margin-top:2px}

/* Painel Emojis */
.emoji-picker{height:160px;background:#fff;border-top:1px solid #ccc;display:flex;flex-direction:column;flex-shrink:0}
.emoji-tabs{display:flex;background:#e0e0e0;border-bottom:1px solid #ccc}
.emoji-tab{flex:1;padding:8px;border:0;background:transparent;font-weight:bold;cursor:pointer;font-size:12px;color:#555}
.emoji-tab.active{background:#fff;color:#075e54;border-bottom:2px solid #075e54}
.emoji-content{flex:1;padding:8px;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start}
.emoji-btn{background:transparent;border:0;font-size:22px;padding:6px;cursor:pointer;border-radius:4px;margin:2px}
.emoji-btn:hover,.emoji-btn:active{background:#eee}
.emoticon-btn{background:#f0f2f5;border:1px solid #ccc;font-size:13px;padding:6px 10px;cursor:pointer;border-radius:14px;margin:3px;font-family:monospace}

/* Campo de Digitação */
.composer{background:#f0f2f5;padding:8px;display:flex;align-items:flex-end;flex-shrink:0}
.iconbtn{width:44px;height:44px;min-width:44px;border:0;border-radius:50%;background:#fff;font-size:20px;margin-right:6px;cursor:pointer}
.composer textarea{
  flex:1;
  height:48px;
  min-height:48px;
  max-height:96px;
  resize:none;
  overflow-y:auto;
  border:1px solid #ccc !important;
  border-radius:24px;
  padding:12px 14px;
  min-width:0;
  margin-right:6px;
  background:#ffffff !important;
  color:#000000 !important;
  font-size:16px !important;
  line-height:22px;
  -webkit-appearance:none;
}
.send{width:78px;height:44px;min-width:78px;border:0;border-radius:22px;background:#075e54;color:#fff;font-weight:bold;cursor:pointer}

.recording{font-size:12px;color:#b00020;padding:4px 10px;background:#f0f2f5}
.status{height:18px;background:#f0f2f5;color:#777;font-size:10px;padding-left:12px}

/* Stickers */
.sticker-picker{height:210px;background:#fff;border-top:1px solid #ccc;display:flex;flex-direction:column;flex-shrink:0}
.sticker-tabs{display:flex;background:#e0e0e0;border-bottom:1px solid #ccc}
.sticker-tab{flex:1;padding:8px;border:0;background:transparent;font-weight:bold;cursor:pointer;font-size:12px;color:#555}
.sticker-tab.active{background:#fff;color:#075e54;border-bottom:2px solid #075e54}
.sticker-actions{display:flex;background:#f5f5f5;border-bottom:1px solid #ccc}
.sticker-action{flex:1;padding:8px 4px;border:0;background:transparent;font-weight:bold;font-size:12px;color:#555;cursor:pointer}
.sticker-action.active{background:#fff;color:#075e54;border-bottom:2px solid #075e54}
.sticker-list{position:relative}
.sticker-item{width:25%;min-width:72px;text-align:center;padding:4px;position:relative}
.sticker-item .sticker-btn{width:100%;min-width:0}
.sticker-save{display:block;width:100%;height:22px;border:0;border-radius:4px;background:#075e54;color:#fff;font-size:10px;cursor:pointer;margin-top:2px}
.sticker-owner{font-size:9px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticker-create{padding:10px;background:#fff;border-bottom:1px solid #ccc}
.sticker-create input{width:100%;height:36px;border:1px solid #bbb;border-radius:5px;padding:0 8px;margin-bottom:6px}
.sticker-create button{height:36px;border:0;border-radius:5px;background:#075e54;color:#fff;font-weight:bold;padding:0 12px;margin-right:4px}
.sticker-create .cancel{background:#777}
.sticker-empty{text-align:center;color:#777;padding:20px;font-size:12px}

.sticker-list{flex:1;padding:8px;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start}
.sticker-btn{width:25%;min-width:72px;height:82px;background:#fff;border:0;cursor:pointer;border-radius:8px;padding:5px}
.sticker-btn:active{background:#eee}
.sticker-btn img{width:68px;height:68px;max-width:100%;display:block;margin:auto}
.sticker-bubble{width:150px;height:150px;max-width:150px;background:transparent!important;box-shadow:none!important;padding:2px}
.sticker-image{width:145px;height:145px;display:block}

/* Conversa em tela cheia */
.conversation-fullscreen .top{display:none}
.conversation-fullscreen .side{display:none}
.conversation-fullscreen .body{height:100%}
.conversation-fullscreen .chatbar{height:54px}
.back-chat{display:none}
.fullscreen-btn{border:0;background:transparent;color:#555;font-size:18px;padding:6px 8px;cursor:pointer}
.back-chat{border:0;background:transparent;color:#075e54;font-size:28px;line-height:1;padding:3px 8px;cursor:pointer}
.empty{text-align:center;color:#777;margin-top:30px}

@media(max-width:650px){
  .top{height:50px}
  .brand{font-size:16px}
  .side{width:100%;padding:4px}
  .person{font-size:14px;padding:14px 10px}
  .me{display:none}
  .body{position:relative}
  .chat{display:none}
  .body.has-chat .side{display:none}
  .body.has-chat .chat{display:flex;width:100%}
  .body.has-chat .back-chat{display:block}
  .bubble{max-width:90%}
  .send{width:62px;min-width:62px;font-size:12px}
  .color-group{display:none}
  .composer{padding:6px}
  .iconbtn{width:40px;min-width:40px;height:40px;font-size:18px;margin-right:4px}
  .composer textarea{height:52px;min-height:52px;border-radius:25px;font-size:16px!important;padding:13px 13px}
  .sticker-picker{height:250px}
  .sticker-btn{width:25%;min-width:65px;height:78px}
  .sticker-item{width:25%;min-width:65px}
  .sticker-save{font-size:9px}
  .sticker-create input{font-size:16px}
  .sticker-btn img{width:62px;height:62px}
  .sticker-bubble{width:135px;height:135px;max-width:135px}
  .sticker-image{width:130px;height:130px}
}

@media(max-width:650px) and (orientation:landscape){
  .sticker-picker{height:170px}
}

<div id="login">
  <div class="login-card">
    <h1>Whatsapp 2</h1>
    <p>Conversa privada</p>
    <input id="email" placeholder="E-mail" autocomplete="off">
    <input id="pass" type="password" placeholder="Senha">
    <button id="loginBtn">Entrar</button>
    <div id="err" class="error"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top">
    <div class="brand">Whatsapp 2</div>
    <div id="me" class="me"></div>
    
    <div class="color-group" title="Cor do fundo">
      <label>Fundo:</label>
      <input type="color" id="bgColorPicker" value="#efe7dd">
    </div>
    
    <div class="color-group" title="Cor dos meus balões">
      <label>Balão:</label>
      <input type="color" id="bubbleColorPicker" value="#dcf8c6">
    </div>

    <button id="logout">Sair</button>
  </div>
  <div class="body">
    <div id="side" class="side"></div>
    <div class="chat">
      <div class="chatbar">
        <button id="backChat" class="back-chat" title="Voltar">‹</button>
        <div id="chatName" class="name">Selecione uma conversa</div>
        <button id="fullScreenBtn" class="fullscreen-btn" title="Tela cheia">⛶</button>
        <button id="clearBtn" class="hidden">Limpar</button>
      </div>
      <div id="messages" class="messages">
        <div class="empty">Escolha uma conversa.</div>
      </div>
      <div id="status" class="status"></div>
      <div id="rec" class="recording hidden">● Gravando áudio... clique novamente para parar</div>
      
      <div id="emojiPicker" class="emoji-picker hidden">
        <div class="emoji-tabs">
          <button id="tabEmojis" class="emoji-tab active">Emojis</button>
          <button id="tabEmoticons" class="emoji-tab">Emoticons</button>
        </div>
        <div id="emojiList" class="emoji-content"></div>
      </div>

      <div id="stickerPicker" class="sticker-picker hidden">
        <div class="sticker-tabs">
          <button id="stickerTab" class="sticker-tab active">Stickers</button>
        </div>
        <div class="sticker-actions">
          <button id="stickerAllBtn" class="sticker-action active">Todos</button>
          <button id="stickerMineBtn" class="sticker-action">Meus</button>
          <button id="stickerSavedBtn" class="sticker-action">Salvos</button>
          <button id="stickerNewBtn" class="sticker-action">Criar</button>
        </div>
        <div id="stickerCreate" class="sticker-create hidden">
          <input id="stickerName" type="text" maxlength="40" placeholder="Nome do sticker">
          <input id="stickerFile" type="file" accept="image/*" class="hidden">
          <button id="stickerChooseBtn">Escolher imagem</button>
          <button id="stickerCreateBtn">Criar sticker</button>
          <button id="stickerCancelBtn" class="cancel">Cancelar</button>
          <div id="stickerCreateStatus" class="sticker-owner"></div>
        </div>
        <div id="stickerList" class="sticker-list"></div>
      </div>

      <div class="composer">
        <button id="emojiToggleBtn" class="iconbtn" title="Emojis">😊</button>
        <button id="stickerToggleBtn" class="iconbtn" title="Stickers">★</button>
        <button id="photoBtn" class="iconbtn" title="Foto">📎</button>
        <input id="file" type="file" accept="image/*,audio/*" class="hidden">
        <button id="micBtn" class="iconbtn" title="Gravar áudio">🎤</button>
        <textarea id="text" placeholder="Digite sua mensagem..." maxlength="2000" autocomplete="off"></textarea>
        <button id="send" class="send">Enviar</button>
      </div>
    </div>
  </div>
</div>

function $(id){return document.getElementById(id);}
function esc(t){return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function playNotificationSound(){

function req(m, u, body, headers, cb){
  var xhr = new XMLHttpRequest();
  xhr.open(m, u, true);
  if(headers){
    for(var h in headers){ xhr.setRequestHeader(h, headers[h]); }
  }
  xhr.onreadystatechange = function(){
    if(xhr.readyState === 4){
      var d = null;
      try{ d = JSON.parse(xhr.responseText); }catch(e){}
      cb(xhr.status, d, xhr.responseText);
    }
  };
  xhr.send(body || null);
}

function reqSupabase(m, endpoint, body, headers, cb){
  var u = SUPABASE_URL + "/rest/v1/" + endpoint;
  var h = {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  };
  if(headers){
    for(var k in headers){ h[k] = headers[k]; }
  }
  req(m, u, body, h, cb);
}

function switchStickerView(view){
  stickerState.view = view;
  var btns = ["All", "Mine", "Saved", "New"];
  for(var i=0; i<btns.length; i++){
    var b = $("sticker" + btns[i] + "Btn");
    if(b){
      if(btns[i].toLowerCase() === view){
        b.classList.add("active");
      } else {
        b.classList.remove("active");
      }
    }
  }

  if(view === "new"){
    $("stickerCreate").classList.remove("hidden");
    $("stickerList").classList.add("hidden");
    $("stickerName").value = "";
    $("stickerFile").value = "";
    $("stickerCreateStatus").innerHTML = "";
  } else {
    $("stickerCreate").classList.add("hidden");
    $("stickerList").classList.remove("hidden");
    renderStickerList();
  }
}

function getSavedStickerIds(){
  var saved = localStorage.getItem("saved_stickers_" + S.uid);
  if(!saved) return [];
  try { return JSON.parse(saved) || []; } catch(e){ return []; }
}

function setSavedStickerIds(ids){
  localStorage.setItem("saved_stickers_" + S.uid, JSON.stringify(ids));
  stickerState.savedIds = ids;
}

function toggleSaveSticker(stickerId){
  var ids = getSavedStickerIds();
  var idx = ids.indexOf(stickerId);
  if(idx >= 0){
    ids.splice(idx, 1);
  } else {
    ids.push(stickerId);
  }
  setSavedStickerIds(ids);
  renderStickerList();
}

function loadStickers(){
  stickerState.savedIds = getSavedStickerIds();
  reqSupabase("GET", "stickers?select=*&order=created_at.desc", null, null, function(st, data){
    if(st === 200 && Array.isArray(data)){
      stickerState.list = data;
    } else {
      stickerState.list = [];
    }
    renderStickerList();
  });
}

function renderStickerList(){
  var listEl = $("stickerList");
  if(!listEl) return;
  listEl.innerHTML = "";

  var items = [];
  if(stickerState.view === "all"){
    items = stickerState.list;
  } else if(stickerState.view === "mine"){
    items = stickerState.list.filter(function(s){ return s.owner_uid === S.uid; });
  } else if(stickerState.view === "saved"){
    items = stickerState.list.filter(function(s){ return stickerState.savedIds.indexOf(s.id) >= 0; });
  }

  if(items.length === 0){
    listEl.innerHTML = '<div class="sticker-empty">Nenhum sticker encontrado.</div>';
    return;
  }

  for(var i=0; i<items.length; i++){
    (function(item){
      var container = document.createElement("div");
      container.className = "sticker-item";

      var btn = document.createElement("button");
      btn.className = "sticker-btn";
      btn.title = item.name || "Sticker";
      
      var img = document.createElement("img");
      img.src = item.image_url;
      img.alt = item.name || "Sticker";

      btn.appendChild(img);
      btn.onclick = function(){ sendSticker(item.image_url); };

      var isSaved = stickerState.savedIds.indexOf(item.id) >= 0;
      var saveBtn = document.createElement("button");
      saveBtn.className = "sticker-save";
      saveBtn.innerHTML = isSaved ? "Remover" : "Salvar";
      saveBtn.onclick = function(e){
        e.stopPropagation();
        toggleSaveSticker(item.id);
      };

      var ownerInfo = document.createElement("div");
      ownerInfo.className = "sticker-owner";
      var ownerName = USERS[item.owner_uid] ? USERS[item.owner_uid].name : "Anônimo";
      ownerInfo.innerHTML = esc(item.name || "Sem nome") + "<br>" + esc(ownerName);

      container.appendChild(btn);
      container.appendChild(saveBtn);
      container.appendChild(ownerInfo);
      listEl.appendChild(container);
    })(items[i]);
  }
}

function handleStickerFileSelect(){
  var fileInput = $("stickerFile");

  if(fileInput.files && fileInput.files[0]){
    statusEl.innerHTML = "Arquivo selecionado: " + esc(fileInput.files[0].name);

function submitStickerCreate(){
  var name = $("stickerName").value.trim();
  var fileInput = $("stickerFile");
  var statusEl = $("stickerCreateStatus");

  if(!name){ statusEl.innerHTML = "Informe um nome para o sticker."; return; }
  if(!fileInput.files || !fileInput.files[0]){ statusEl.innerHTML = "Selecione uma imagem."; return; }

  var file = fileInput.files[0];
  statusEl.innerHTML = "Enviando imagem...";

  uploadToSupabaseStorage(file, function(err, publicUrl){
    if(err){
      statusEl.innerHTML = "Erro ao enviar imagem: " + err;
      return;
    }

    statusEl.innerHTML = "Salvando sticker...";
    var payload = JSON.stringify({
      name: name,
      image_url: publicUrl,
      owner_uid: S.uid
    });

    reqSupabase("POST", "stickers", payload, {"Prefer": "return=representation"}, function(st, data){
      if(st === 201 || st === 200){
        statusEl.innerHTML = "Sticker criado com sucesso!";
        setTimeout(function(){
          switchStickerView("all");
          loadStickers();
        }, 800);
      } else {
        statusEl.innerHTML = "Erro ao cadastrar sticker na base de dados.";
      }
    });
  });
}

function sendSticker(imageUrl){
  if(!S.conv) return;
  var payload = {
    sender: S.uid,
    text: "[sticker]" + imageUrl,
    time: Date.now()
  };
  pushMessage(payload, function(){
    $("stickerPicker").classList.add("hidden");
  });
}

function uploadToSupabaseStorage(file, cb){
  var ext = file.name.split('.').pop();
  var path = "stickers/" + Date.now() + "_" + Math.random().toString(36).substring(2,7) + "." + ext;
  var uploadUrl = SUPABASE_URL + "/storage/v1/object/chat-media/" + path;

  var xhr = new XMLHttpRequest();
  xhr.open("POST", uploadUrl, true);
  xhr.setRequestHeader("apikey", SUPABASE_ANON_KEY);
  xhr.setRequestHeader("Authorization", "Bearer " + SUPABASE_ANON_KEY);
  xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");

  xhr.onreadystatechange = function(){
    if(xhr.readyState === 4){
      if(xhr.status === 200 || xhr.status === 201){
        var publicUrl = SUPABASE_URL + "/storage/v1/object/public/chat-media/" + path;
        cb(null, publicUrl);
      } else {
        cb("Upload falhou (status " + xhr.status + ")");
      }
    }
  };
  xhr.send(file);
}

function insertAtCursor(myField, myValue) {
  if (document.selection) {
    myField.focus();
    var sel = document.selection.createRange();
    sel.text = myValue;
  } else if (myField.selectionStart || myField.selectionStart === 0) {
    var startPos = myField.selectionStart;
    var endPos = myField.selectionEnd;
    myField.value = myField.value.substring(0, startPos) + myValue + myField.value.substring(endPos, myField.value.length);
    myField.selectionStart = startPos + myValue.length;
    myField.selectionEnd = startPos + myValue.length;
  } else {
    myField.value += myValue;
  }
  myField.focus();
}

function login(){
  var e = $("email").value, p = $("pass").value;
  $("err").innerHTML = "";
  if(!e || !p){ $("err").innerHTML = "Preencha tudo."; return; }
  
  var u = "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + FIREBASE_API_KEY;
  var body = JSON.stringify({
    email: e,
    password: p,
    returnSecureToken: true
  });
  
  // Enviado como text/plain contendo JSON para evitar requisição CORS OPTIONS (preflight)
  req("POST", u, body, {"Content-Type": "text/plain"}, function(st, d, txt){
    if(st === 200 && d && d.idToken){
      if(!USERS[d.localId]){
        $("err").innerHTML = "Usuário não autorizado.";
        return;
      }
      S.token = d.idToken;
      S.refresh = d.refreshToken;
      S.uid = d.localId;

      // Persistir no navegador
      localStorage.setItem("user_token", d.idToken);
      localStorage.setItem("user_refresh", d.refreshToken);
      localStorage.setItem("user_uid", d.localId);

      $("login").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("me").innerHTML = esc(USERS[S.uid] ? USERS[S.uid].name : S.uid);
      loadSavedColors();
      renderSide();
      startSync();
    } else {
      $("err").innerHTML = "Erro no login: " + (d && d.error ? d.error.message : st);
    }
  });
}

function logout(){
  if(S.timer) clearInterval(S.timer);
  S={token:null,refresh:null,uid:null,conv:null,other:null,data:{},timer:null,lastSeen:0,recording:false,rec:null,chunks:[],ready:false};
  
  localStorage.removeItem("user_token");
  localStorage.removeItem("user_refresh");
  localStorage.removeItem("user_uid");

  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
}

function refreshTokenAndRetry(cb){
  if(!S.refresh) return;
  var u = "https://securetoken.googleapis.com/v1/tokens?key=" + FIREBASE_API_KEY;
  var body = JSON.stringify({
    grant_type: "refresh_token",
    refresh_token: S.refresh
  });
  
  req("POST", u, body, {"Content-Type": "text/plain"}, function(st, d){
    if(st === 200 && d && (d.id_token || d.idToken)){
      S.token = d.id_token || d.idToken;
      S.refresh = d.refresh_token || d.refreshToken;

      localStorage.setItem("user_token", S.token);
      localStorage.setItem("user_refresh", S.refresh);

      if(cb) cb();
    } else {
      logout();
    }
  });
}

function startSync(){
  fetchData();
  if(S.timer) clearInterval(S.timer);
  S.timer = setInterval(fetchData, 3000);
}

function fetchData(){
  if(!S.token) return;
  var u = FIREBASE_DATABASE_URL + "/chats.json?auth=" + S.token;
  req("GET", u, null, null, function(st, d){
    if(st === 401){
      refreshTokenAndRetry(fetchData);
      return;
    }
    if(st === 200 && d){
      var oldData = S.data;
      S.data = d;
      checkNewMessages(oldData, d);
      
      if(!S.ready){
        S.ready = true;
        renderSide();
      }
      
      if(S.conv){
        renderMessages();
      }
    }
  });
}

function checkNewMessages(oldData, newData){
  if(!S.ready) return;
  
  for(var convKey in newData){
    if(!isAllowedConv(convKey)) continue;
    
    var oldMsgs = (oldData && oldData[convKey]) ? oldData[convKey] : {};
    var newMsgs = newData[convKey] || {};
    
    for(var msgId in newMsgs){
      if(!oldMsgs[msgId]){
        var msg = newMsgs[msgId];
        if(msg.sender && msg.sender !== S.uid){
          playNotificationSound();
          return;
        }
      }
    }
  }
}

function isAllowedConv(cKey){
  if(cKey === GROUP_ID && GROUP_MEMBERS.indexOf(S.uid) >= 0) return true;
  if(cKey === GROUP2_ID && GROUP2_MEMBERS.indexOf(S.uid) >= 0) return true;
  var p = cKey.split("_");
  if(p.length === 2 && (p[0] === S.uid || p[1] === S.uid)){
    var other = p[0] === S.uid ? p[1] : p[0];
    if(USERS[other]) return true;
  }
  return false;
}
  
function getConvKey(uid1, uid2){
  return uid1 < uid2 ? uid1 + "_" + uid2 : uid2 + "_" + uid1;
}

function renderSide(){
  var side = $("side");
  side.innerHTML = "";

  if(GROUP_MEMBERS.indexOf(S.uid) >= 0){
    var btnG = document.createElement("button");
    btnG.className = "person" + (S.conv === GROUP_ID ? " active" : "");
    btnG.innerHTML = esc(GROUP_NAME) + "<small>Grupo (" + GROUP_MEMBERS.length + " membros)</small>";
    btnG.onclick = function(){ selectConv(GROUP_ID, null, GROUP_NAME); };
    side.appendChild(btnG);
  }

  if(GROUP2_MEMBERS.indexOf(S.uid) >= 0){
    var btnG2 = document.createElement("button");
    btnG2.className = "person" + (S.conv === GROUP2_ID ? " active" : "");
    btnG2.innerHTML = esc(GROUP2_NAME) + "<small>Grupo (" + GROUP2_MEMBERS.length + " membros)</small>";
    btnG2.onclick = function(){ selectConv(GROUP2_ID, null, GROUP2_NAME); };
    side.appendChild(btnG2);
  }

  for(var uid in USERS){
    if(uid !== S.uid){
      (function(id){
        var key = getConvKey(S.uid, id);
        var btn = document.createElement("button");
        btn.className = "person" + (S.conv === key ? " active" : "");
        btn.innerHTML = esc(USERS[id].name) + "<small>Conversa privada</small>";
        btn.onclick = function(){ selectConv(key, id, USERS[id].name); };
        side.appendChild(btn);
      })(uid);
    }
  }
}

function selectConv(key, otherUid, title){
  S.conv = key;
  S.other = otherUid;
  $("chatName").innerHTML = esc(title);
  $("clearBtn").classList.remove("hidden");
  
  var body = document.querySelector(".body");

function renderMessages(){
  var box = $("messages");
  box.innerHTML = "";
  
  if(!S.conv || !S.data[S.conv]){
    box.innerHTML = '<div class="empty">Sem mensagens ainda.</div>';
    return;
  }

  var msgs = S.data[S.conv];
  var arr = [];
  for(var id in msgs){
    var m = msgs[id];
    m._id = id;
    arr.push(m);
  }
  
  arr.sort(function(a,b){ return (a.time||0) - (b.time||0); });

  for(var i=0; i<arr.length; i++){
    var m = arr[i];
    var isMine = m.sender === S.uid;
    
    var row = document.createElement("div");
    row.className = "bubble-row" + (isMine ? " mine" : "");
    
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    
    if(S.conv === GROUP_ID || S.conv === GROUP2_ID){
      var senderName = USERS[m.sender] ? USERS[m.sender].name : m.sender;
      var nameEl = document.createElement("div");
      nameEl.style.fontSize = "11px";
      nameEl.style.fontWeight = "bold";
      nameEl.style.color = isMine ? "#075e54" : "#e52d27";
      nameEl.style.marginBottom = "3px";
      nameEl.innerHTML = esc(senderName);
      bubble.appendChild(nameEl);
    }

    var txt = m.text || "";
    if(txt.indexOf("[sticker]") === 0){
      var stickerUrl = txt.substring(9);
      bubble.classList.add("sticker-bubble");
      var img = document.createElement("img");
      img.src = stickerUrl;
      img.className = "sticker-image";
      bubble.appendChild(img);
    } else if(txt.indexOf("http") === 0 && (txt.indexOf(".jpg") > 0 || txt.indexOf(".png") > 0 || txt.indexOf(".gif") > 0 || txt.indexOf(".webp") > 0)){
      var img = document.createElement("img");
      img.src = txt;
      img.className = "photo";
      bubble.appendChild(img);
    } else if(txt.indexOf("data:audio") === 0 || (txt.indexOf("http") === 0 && (txt.indexOf(".mp3") > 0 || txt.indexOf(".ogg") > 0 || txt.indexOf(".wav") > 0 || txt.indexOf(".m4a") > 0))){
      var audioBox = document.createElement("div");
      audioBox.className = "audio-box";

      var aud = document.createElement("audio");
      aud.controls = true;
      aud.className = "audio";

      var src = document.createElement("source");
      src.src = txt;
      aud.appendChild(src);

      var fallbackBtn = document.createElement("a");
      fallbackBtn.className = "audio-fallback-btn";
      fallbackBtn.href = txt;
      fallbackBtn.target = "_blank";
      fallbackBtn.innerHTML = "▶ Play / Abrir Áudio";

      audioBox.appendChild(aud);
      audioBox.appendChild(fallbackBtn);
      bubble.appendChild(audioBox);
    } else {
      var txtNode = document.createElement("span");
      txtNode.innerHTML = esc(txt);
      bubble.appendChild(txtNode);
    }

    var timeEl = document.createElement("span");
    timeEl.className = "time";
    timeEl.innerHTML = formatTime(m.time);
    bubble.appendChild(timeEl);

    row.appendChild(bubble);
    box.appendChild(row);
  }

  box.scrollTop = box.scrollHeight;
}

function formatTime(ts){
  if(!ts) return "";
  var d = new Date(ts);
  var h = ("0"+d.getHours()).slice(-2);
  var m = ("0"+d.getMinutes()).slice(-2);
  return h + ":" + m;
}

function pushMessage(payload, cb){
  if(!S.conv || !S.token) return;
  var u = FIREBASE_DATABASE_URL + "/chats/" + S.conv + ".json?auth=" + S.token;
  req("POST", u, JSON.stringify(payload), null, function(st){
    if(st === 401){
      refreshTokenAndRetry(function(){ pushMessage(payload, cb); });
      return;
    }
    if(cb) cb();
    fetchData();
  });
}

function sendText(){
  var input = $("text");
  var t = input.value.trim();
  if(!t || !S.conv) return;

  var payload = {
    sender: S.uid,
    text: t,
    time: Date.now()
  };

  input.value = "";
  pushMessage(payload);
}

function sendFile(){
  var f = $("file").files[0];
  if(!f || !S.conv) return;

  var r = new FileReader();
  r.onload = function(e){
    var payload = {
      sender: S.uid,
      text: e.target.result,
      time: Date.now()
    };
    pushMessage(payload);
    $("file").value = "";
  };
  r.readAsDataURL(f);
}

function clearChat(){
  if(!S.conv || !S.token) return;
  if(!confirm("Tem certeza que deseja apagar o histórico desta conversa?")) return;

  var u = FIREBASE_DATABASE_URL + "/chats/" + S.conv + ".json?auth=" + S.token;
  req("DELETE", u, null, null, function(st){
    if(st === 401){
      refreshTokenAndRetry(clearChat);
      return;
    }
    fetchData();
  });
}

function toggleRecord(){
  if(S.recording){
    stopRecord();
  } else {
    startRecord();
  }
}

function startRecord(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert("Gravação de áudio não suportada neste navegador.");
    return;
  }

  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
    S.recording = true;
    S.chunks = [];
    $("rec").classList.remove("hidden");

    var mime = "audio/webm";
    if(!MediaRecorder.isTypeSupported("audio/webm") && MediaRecorder.isTypeSupported("audio/mp4")){
      mime = "audio/mp4";
    }

    S.rec = new MediaRecorder(stream, { mimeType: mime });
    S.rec.ondataavailable = function(e){
      if(e.data.size > 0) S.chunks.push(e.data);
    };

    S.rec.onstop = function(){
      var blob = new Blob(S.chunks, { type: mime });
      var r = new FileReader();
      r.onload = function(e){
        var payload = {
          sender: S.uid,
          text: e.target.result,
          time: Date.now()
        };
        pushMessage(payload);
      };
      r.readAsDataURL(blob);

      stream.getTracks().forEach(function(track){ track.stop(); });
    };

    S.rec.start();
  }).catch(function(err){
    alert("Permissão para microfone negada ou erro: " + err.message);
  });
}

function stopRecord(){
  if(S.rec && S.recording){
    S.recording = false;
    $("rec").classList.add("hidden");
    S.rec.stop();
  }
}

window.onload = setupApp;
</script>
