<html lang="pt-BR">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#075e54">
<title>Whatsapp 2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#efe7dd;color:#222}
button,input{font:inherit}
.hidden{display:none!important}

#login{height:100%;display:flex;align-items:center;justify-content:center;background:#075e54;padding:18px}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:10px;padding:24px;box-shadow:0 3px 14px #0004}
.login-card h1{margin:0 0 6px;color:#075e54}
.login-card p{margin:0 0 18px;color:#666}
.login-card input{width:100%;height:46px;margin:6px 0;padding:0 12px;border:1px solid #bbb;border-radius:7px;color:#000;background:#fff}
.login-card button{width:100%;height:46px;margin-top:8px;border:0;border-radius:7px;background:#075e54;color:#fff;font-weight:bold}
.error{color:#b00020;margin-top:10px;font-size:13px}

/* Layout App */
#app{position:fixed;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column}
.top{height:58px;background:#075e54;color:#fff;display:flex;align-items:center;padding:0 8px;flex-shrink:0}
.brand{font-size:18px;font-weight:bold;flex:1}
.me{font-size:12px;margin-right:6px;color:#d7eeeb}

/* Seletores de Cor */
.color-group{display:flex;align-items:center;margin-right:6px}
.color-group label{font-size:10px;margin-right:2px;color:#fff}
.top input[type=color]{width:28px;height:28px;padding:0;border:1px solid #ffffff66;background:transparent;cursor:pointer;border-radius:4px}
.top button{background:#064f48;color:#fff;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12px}

.body{display:flex;flex:1;min-height:0}
.side{width:250px;background:#fff;border-right:1px solid #ccc;padding:8px;overflow-y:auto}
.person{width:100%;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left;padding:13px 10px;font-weight:bold;cursor:pointer}
.person.active{background:#e8f5f3}
.person small{display:block;color:#888;font-weight:normal;margin-top:3px}

.chat{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.chatbar{height:52px;background:#f0f2f5;border-bottom:1px solid #ccc;display:flex;align-items:center;padding:0 10px;font-weight:bold;flex-shrink:0}
.chatbar .name{flex:1}
.chatbar button{border:0;background:transparent;color:#555;font-size:13px}

.messages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;background:#efe7dd}
.bubble-row{display:flex;margin:4px 0}
.bubble-row.mine{justify-content:flex-end}
.bubble{max-width:82%;padding:7px 9px;border-radius:8px;background:#fff;box-shadow:0 1px 1px #0002;word-wrap:break-word;white-space:pre-wrap}
.mine .bubble{background:#dcf8c6}

.time{font-size:10px;color:#777;float:right;margin:8px 0 0 8px}
.photo{max-width:300px;width:100%;display:block;border-radius:6px}
.audio-box{display:flex;flex-direction:column;gap:4px;min-width:220px}
.audio{width:100%;height:40px}
.audio-fallback-btn{display:inline-block;padding:6px 10px;background:#075e54;color:#fff;text-decoration:none;border-radius:4px;font-size:12px;text-align:center;font-weight:bold;margin-top:2px}

/* Painel Emojis */
.emoji-picker{height:160px;background:#fff;border-top:1px solid #ccc;display:flex;flex-direction:column;flex-shrink:0}
.emoji-tabs{display:flex;background:#e0e0e0;border-bottom:1px solid #ccc}
.emoji-tab{flex:1;padding:8px;border:0;background:transparent;font-weight:bold;cursor:pointer;font-size:12px;color:#555}
.emoji-tab.active{background:#fff;color:#075e54;border-bottom:2px solid #075e54}
.emoji-content{flex:1;padding:8px;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start}
.emoji-btn{background:transparent;border:0;font-size:22px;padding:6px;cursor:pointer;border-radius:4px;margin:2px}
.emoji-btn:hover,.emoji-btn:active{background:#eee}
.emoticon-btn{background:#f0f2f5;border:1px solid #ccc;font-size:13px;padding:6px 10px;cursor:pointer;border-radius:14px;margin:3px;font-family:monospace}

/* Campo de Digitação */
.composer{background:#f0f2f5;padding:8px;display:flex;align-items:flex-end;flex-shrink:0}
.iconbtn{width:44px;height:44px;min-width:44px;border:0;border-radius:50%;background:#fff;font-size:20px;margin-right:6px;cursor:pointer}
.composer textarea{
  flex:1;
  height:48px;
  min-height:48px;
  max-height:96px;
  resize:none;
  overflow-y:auto;
  border:1px solid #ccc !important;
  border-radius:24px;
  padding:12px 14px;
  min-width:0;
  margin-right:6px;
  background:#ffffff !important;
  color:#000000 !important;
  font-size:16px !important;
  line-height:22px;
  -webkit-appearance:none;
}
.send{width:78px;height:44px;min-width:78px;border:0;border-radius:22px;background:#075e54;color:#fff;font-weight:bold;cursor:pointer}

.recording{font-size:12px;color:#b00020;padding:4px 10px;background:#f0f2f5}
.status{height:18px;background:#f0f2f5;color:#777;font-size:10px;padding-left:12px}

/* Stickers */
.sticker-picker{height:210px;background:#fff;border-top:1px solid #ccc;display:flex;flex-direction:column;flex-shrink:0}
.sticker-tabs{display:flex;background:#e0e0e0;border-bottom:1px solid #ccc}
.sticker-tab{flex:1;padding:8px;border:0;background:transparent;font-weight:bold;cursor:pointer;font-size:12px;color:#555}
.sticker-tab.active{background:#fff;color:#075e54;border-bottom:2px solid #075e54}
.sticker-actions{display:flex;background:#f5f5f5;border-bottom:1px solid #ccc}
.sticker-action{flex:1;padding:8px 4px;border:0;background:transparent;font-weight:bold;font-size:12px;color:#555;cursor:pointer}
.sticker-action.active{background:#fff;color:#075e54;border-bottom:2px solid #075e54}
.sticker-list{position:relative}
.sticker-item{width:25%;min-width:72px;text-align:center;padding:4px;position:relative}
.sticker-item .sticker-btn{width:100%;min-width:0}
.sticker-save{display:block;width:100%;height:22px;border:0;border-radius:4px;background:#075e54;color:#fff;font-size:10px;cursor:pointer;margin-top:2px}
.sticker-owner{font-size:9px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticker-create{padding:10px;background:#fff;border-bottom:1px solid #ccc}
.sticker-create input{width:100%;height:36px;border:1px solid #bbb;border-radius:5px;padding:0 8px;margin-bottom:6px}
.sticker-create button{height:36px;border:0;border-radius:5px;background:#075e54;color:#fff;font-weight:bold;padding:0 12px;margin-right:4px}
.sticker-create .cancel{background:#777}
.sticker-empty{text-align:center;color:#777;padding:20px;font-size:12px}

.sticker-list{flex:1;padding:8px;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start}
.sticker-btn{width:25%;min-width:72px;height:82px;background:#fff;border:0;cursor:pointer;border-radius:8px;padding:5px}
.sticker-btn:active{background:#eee}
.sticker-btn img{width:68px;height:68px;max-width:100%;display:block;margin:auto}
.sticker-bubble{width:150px;height:150px;max-width:150px;background:transparent!important;box-shadow:none!important;padding:2px}
.sticker-image{width:145px;height:145px;display:block}

/* Conversa em tela cheia */
.conversation-fullscreen .top{display:none}
.conversation-fullscreen .side{display:none}
.conversation-fullscreen .body{height:100%}
.conversation-fullscreen .chatbar{height:54px}
.back-chat{display:none}
.fullscreen-btn{border:0;background:transparent;color:#555;font-size:18px;padding:6px 8px;cursor:pointer}.back-chat{border:0;background:transparent;color:#075e54;font-size:28px;line-height:1;padding:3px 8px;cursor:pointer}
.empty{text-align:center;color:#777;margin-top:30px}

@media(max-width:650px){
  .top{height:50px}
  .brand{font-size:16px}
  .side{width:100%;padding:4px}
  .person{font-size:14px;padding:14px 10px}
  .me{display:none}
  .body{position:relative}
  .chat{display:none}
  .body.has-chat .side{display:none}
  .body.has-chat .chat{display:flex;width:100%}
  .body.has-chat .back-chat{display:block}
  .bubble{max-width:90%}
  .send{width:62px;min-width:62px;font-size:12px}
  .color-group{display:none}
  .composer{padding:6px}
  .iconbtn{width:40px;min-width:40px;height:40px;font-size:18px;margin-right:4px}
  .composer textarea{height:52px;min-height:52px;border-radius:25px;font-size:16px!important;padding:13px 13px}
  .sticker-picker{height:250px}
  .sticker-btn{width:25%;min-width:65px;height:78px}
  .sticker-item{width:25%;min-width:65px}
  .sticker-save{font-size:9px}
  .sticker-create input{font-size:16px}
  .sticker-btn img{width:62px;height:62px}
  .sticker-bubble{width:135px;height:135px;max-width:135px}
  .sticker-image{width:130px;height:130px}
}

@media(max-width:650px) and (orientation:landscape){
  .sticker-picker{height:170px}
}
</style>

<body>
<div id="login">
  <div class="login-card">
    <h1>Whatsapp 2</h1>
    <p>Conversa privada</p>
    <input id="email" placeholder="E-mail" autocomplete="off">
    <input id="pass" type="password" placeholder="Senha">
    <button id="loginBtn">Entrar</button>
    <div id="err" class="error"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top">
    <div class="brand">Whatsapp 2</div>
    <div id="me" class="me"></div>
    
    <div class="color-group" title="Cor do fundo">
      <label>Fundo:</label>
      <input type="color" id="bgColorPicker" value="#efe7dd">
    </div>
    
    <div class="color-group" title="Cor dos meus balões">
      <label>Balão:</label>
      <input type="color" id="bubbleColorPicker" value="#dcf8c6">
    </div>

    <button id="logout">Sair</button>
  </div>
  <div class="body">
    <div id="side" class="side"></div>
    <div class="chat">
      <div class="chatbar">
        <button id="backChat" class="back-chat" title="Voltar">‹</button>
        <div id="chatName" class="name">Selecione uma conversa</div>
        <button id="fullScreenBtn" class="fullscreen-btn" title="Tela cheia">⛶</button>
        <button id="clearBtn" class="hidden">Limpar</button>
      </div>
      <div id="messages" class="messages">
        <div class="empty">Escolha uma conversa.</div>
      </div>
      <div id="status" class="status"></div>
      <div id="rec" class="recording hidden">● Gravando áudio... clique novamente para parar</div>
      
      <div id="emojiPicker" class="emoji-picker hidden">
        <div class="emoji-tabs">
          <button id="tabEmojis" class="emoji-tab active">Emojis</button>
          <button id="tabEmoticons" class="emoji-tab">Emoticons</button>
        </div>
        <div id="emojiList" class="emoji-content"></div>
      </div>

      <div id="stickerPicker" class="sticker-picker hidden">
        <div class="sticker-tabs">
          <button id="stickerTab" class="sticker-tab active">Stickers</button>
        </div>
        <div class="sticker-actions">
          <button id="stickerAllBtn" class="sticker-action active">Todos</button>
          <button id="stickerMineBtn" class="sticker-action">Meus</button>
          <button id="stickerSavedBtn" class="sticker-action">Salvos</button>
          <button id="stickerNewBtn" class="sticker-action">Criar</button>
        </div>
        <div id="stickerCreate" class="sticker-create hidden">
          <input id="stickerName" type="text" maxlength="40" placeholder="Nome do sticker">
          <input id="stickerFile" type="file" accept="image/*" class="hidden">
          <button id="stickerChooseBtn">Escolher imagem</button>
          <button id="stickerCreateBtn">Criar sticker</button>
          <button id="stickerCancelBtn" class="cancel">Cancelar</button>
          <div id="stickerCreateStatus" class="sticker-owner"></div>
        </div>
        <div id="stickerList" class="sticker-list"></div>
      </div>

      <div class="composer">
        <button id="emojiToggleBtn" class="iconbtn" title="Emojis">😊</button>
        <button id="stickerToggleBtn" class="iconbtn" title="Stickers">★</button>
        <button id="photoBtn" class="iconbtn" title="Foto">📎</button>
        <input id="file" type="file" accept="image/*,audio/*" class="hidden">
        <button id="micBtn" class="iconbtn" title="Gravar áudio">🎤</button>
        <textarea id="text" placeholder="Digite sua mensagem..." maxlength="2000" autocomplete="off"></textarea>
        <button id="send" class="send">Enviar</button>
      </div>
    </div>
  </div>
</div>

<audio id="notificationSound" preload="auto">
  <source src="notificacao.mp3" type="audio/mpeg">
</audio>

function api(url,opt,cb){
  var x=new XMLHttpRequest();
  x.open(opt.method||"GET",url,true);
  if(opt.body!==undefined)x.setRequestHeader("Content-Type","application/json");
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    var d=null;
    try{d=x.responseText?JSON.parse(x.responseText):null}catch(e){}
    cb(x.status,d,x.responseText);
  };
  x.send(opt.body!==undefined?(opt.body===null?null:JSON.stringify(opt.body)):null);
}

}

function dbUrl(){
  return FIREBASE_DATABASE_URL+"/chat/"+S.conv+"/messages.json?auth="+encodeURIComponent(S.token);
}

function load(){
  if(!S.conv)return;
  api(dbUrl(),{method:"GET"},function(st,d){
    if(st===401){refreshToken();return}
    if(st!==200)return;
    var old=S.data;
    S.data=d||{};
    render(old);
  });
}

function render(old){
  var box=$("messages"),wasNearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  var previousHeight=box.scrollHeight,previousTop=box.scrollTop;
  var keys=[],k;
  for(k in S.data)if(S.data.hasOwnProperty(k))keys.push(k);
  keys.sort(function(a,b){return (Number(S.data[a].timestamp)||0)-(Number(S.data[b].timestamp)||0)});
  var h="";
  for(var i=0;i<keys.length;i++){
    var m=S.data[keys[i]],mine=m.senderId===S.uid;
    var senderName=USERS[m.senderId]?USERS[m.senderId].name:"Usuário";
    
    if(m.type==="sticker"){
      h+='<div class="bubble-row '+(mine?'mine':'')+'"><div class="bubble sticker-bubble">';
      if(!mine && S.conv===GROUP_ID) h+='<div style="font-size:11px;font-weight:bold;color:#075e54;margin-bottom:3px">'+esc(senderName)+'</div>';
      h+='<img class="sticker-image" src="'+esc(m.url)+'" alt="Sticker">';
      h+='<span class="time">'+formatTime(m.timestamp)+'</span></div></div>';
    } else {
      h+='<div class="bubble-row '+(mine?'mine':'')+'"><div class="bubble">';
      if(!mine && S.conv===GROUP_ID) h+='<div style="font-size:11px;font-weight:bold;color:#075e54;margin-bottom:3px">'+esc(senderName)+'</div>';
      
      if(m.type==="image")h+='<a href="'+esc(m.url)+'" target="_blank"><img class="photo" src="'+esc(m.url)+'"></a>';
      else if(m.type==="audio"){
        h+='<div class="audio-box">';
        h+='<audio class="audio" controls preload="metadata" src="'+esc(m.url)+'"></audio>';
        h+='<a href="'+esc(m.url)+'" target="_blank" class="audio-fallback-btn">▶ Ouvir / Baixar Áudio</a>';
        h+='</div>';
      }
      else h+=esc(m.text||"");
      
      h+='<span class="time">'+formatTime(m.timestamp)+'</span></div></div>';
    }
  }
  box.innerHTML=h||'<div class="empty">Nenhuma mensagem ainda.</div>';
  if(wasNearBottom){box.scrollTop=box.scrollHeight;}
  else{box.scrollTop=previousTop+(box.scrollHeight-previousHeight);}
  var newest=keys.length?Number(S.data[keys[keys.length-1]].timestamp):0;
  if(old&&newest>S.lastSeen){
    var m2=S.data[keys[keys.length-1]];
    if(m2.senderId!==S.uid)notify(m2);
  }
  S.lastSeen=Math.max(S.lastSeen,newest);
}

function formatTime(ts){
  var d=new Date(Number(ts)||Date.now()),h=d.getHours(),m=d.getMinutes();
  return (h<10?"0":"")+h+":"+(m<10?"0":"")+m;
}

    new Notification(senderName,{body:m.type==="image"?"Foto":m.type==="audio"?"Áudio":m.type==="sticker"?"Sticker":m.text||"Nova mensagem"});

function uploadFile(f){
  if(!f||!S.conv)return;
  if(f.size>50*1024*1024){$('status').innerHTML="Arquivo acima de 50 MB.";return}
  var ext=(f.name.split('.').pop()||"bin").replace(/[^a-zA-Z0-9]/g,"");
  var path=S.conv+"/"+Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext;
  var url=SUPABASE_URL+"/storage/v1/object/chat-media/"+path;
  var x=new XMLHttpRequest();
  x.open("POST",url,true);
  x.setRequestHeader("Authorization","Bearer "+SUPABASE_ANON_KEY);
  x.setRequestHeader("apikey",SUPABASE_ANON_KEY);
  x.setRequestHeader("Content-Type",f.type||"application/octet-stream");
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status>=200&&x.status<300){
      var publicUrl=SUPABASE_URL+"/storage/v1/object/public/chat-media/"+path;
      var isImg = f.type.indexOf("image/")===0;
      var isAud = f.type.indexOf("audio/")===0;
      sendMsg({
        senderId:S.uid,
        senderName:USERS[S.uid].name,
        type: isImg ? "image" : (isAud ? "audio" : "file"),
        url:publicUrl,
        text:"",
        timestamp:Date.now()
      });
    }else $('status').innerHTML="Erro no upload de mídia.";
  };
  x.send(f);
}

function startRecord(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    $('status').innerHTML="Seu navegador não suporta gravação direta.";
    return;
  }
  if(S.recording){stopRecord();return}
  
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    S.recording=true;
    $('rec').className="recording";
    
    var options = {};
    var mimeType = "audio/mp4";
    
    if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
      if (MediaRecorder.isTypeSupported('audio/mp4')) {
        options = { mimeType: 'audio/mp4' };
        mimeType = 'audio/mp4';
      } else if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
        options = { mimeType: 'audio/webm;codecs=opus' };
        mimeType = 'audio/webm';
      } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
        options = { mimeType: 'audio/ogg;codecs=opus' };
        mimeType = 'audio/ogg';
      } else if (MediaRecorder.isTypeSupported('audio/wav')) {
        options = { mimeType: 'audio/wav' };
        mimeType = 'audio/wav';
      }
    }

    try {
      S.rec = new MediaRecorder(stream, options);
    } catch(e) {
      S.rec = new MediaRecorder(stream);
    }
    
    S.chunks=[];
    S.rec.ondataavailable=function(e){ if(e.data && e.data.size > 0) S.chunks.push(e.data); };
    
    S.rec.onstop=function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      
      var finalMime = S.rec.mimeType || mimeType;
      var ext = 'mp4';
      if(finalMime.indexOf('webm') !== -1) ext = 'webm';
      if(finalMime.indexOf('ogg') !== -1) ext = 'ogg';
      if(finalMime.indexOf('wav') !== -1) ext = 'wav';

      var blob = new Blob(S.chunks, { type: finalMime });
      var file = new File([blob], "audio_" + Date.now() + "." + ext, { type: finalMime });
      
      uploadFile(file);
      S.recording=false;
      $('rec').className="recording hidden";
    };
    
    S.rec.start();
  }).catch(function(err){
    $('status').innerHTML="Permissão para microfone recusada ou erro de mídia.";
  });
}

function stopRecord(){if(S.rec&&S.recording)S.rec.stop();}

function insertAtCursor(textToInsert) {
  var input = $('text');
  input.focus();
  if (document.selection) {
    var sel = document.selection.createRange();
    sel.text = textToInsert;
  } else if (input.selectionStart || input.selectionStart === 0) {
    var startPos = input.selectionStart;
    var endPos = input.selectionEnd;
    input.value = input.value.substring(0, startPos) + textToInsert + input.value.substring(endPos, input.value.length);
    input.selectionStart = startPos + textToInsert.length;
    input.selectionEnd = startPos + textToInsert.length;
  } else {
    input.value += textToInsert;
  }
}

function stickerDbUrl(){
  return FIREBASE_DATABASE_URL+"/stickers.json?auth="+encodeURIComponent(S.token);
}
function savedStickerDbUrl(){
  return FIREBASE_DATABASE_URL+"/users/"+S.uid+"/savedStickers.json?auth="+encodeURIComponent(S.token);
}

function loadStickerCollections(cb){
  if(STICKER_STATE.loading){if(cb)cb();return;}
  STICKER_STATE.loading=true;
  var done=0, allData={}, savedData={};
  function finish(){
    done++;
    if(done<2)return;
    STICKER_STATE.all=[];
    var k;
    for(k in allData){
      if(allData.hasOwnProperty(k)) {
        allData[k].id=k;
        STICKER_STATE.all.push(allData[k]);
      }
    }
    STICKER_STATE.saved=savedData||{};
    STICKER_STATE.loading=false;
    if(cb)cb();
  }
  api(stickerDbUrl(),{method:"GET"},function(st,d){
    if(st===401){refreshToken();STICKER_STATE.loading=false;return;}
    if(st===200)allData=d||{};
    finish();
  });
  api(savedStickerDbUrl(),{method:"GET"},function(st,d){
    if(st===401){refreshToken();STICKER_STATE.loading=false;return;}
    if(st===200)savedData=d||{};
    finish();
  });
}

function isSavedSticker(id){
  return !!(STICKER_STATE.saved && STICKER_STATE.saved[id]);
}

function renderStickers(mode){
  STICKER_STATE.mode=mode||"all";
  var list=$('stickerList');
  list.innerHTML="";
  var i, b, img, item, save, owner, st;

  if(STICKER_STATE.mode==="default"){
    for(i=0;i<DEFAULT_STICKERS.length;i++){
      st=DEFAULT_STICKERS[i];
      item=document.createElement('div'); item.className='sticker-item';
      b=document.createElement('button'); b.className='sticker-btn';
      img=document.createElement('img'); img.src=stickerSvg(st[0],st[1]); img.alt=st[1];
      b.appendChild(img);
      b.onclick=(function(index){return function(){sendDefaultSticker(index);};})(i);
      item.appendChild(b); list.appendChild(item);
    }
    return;
  }

  var source=STICKER_STATE.all||[];
  if(STICKER_STATE.mode==="saved"){
    source=[];
    for(i=0;i<STICKER_STATE.all.length;i++){
      if(isSavedSticker(STICKER_STATE.all[i].id))source.push(STICKER_STATE.all[i]);
    }
  }else if(STICKER_STATE.mode==="mine"){
    source=[];
    for(i=0;i<STICKER_STATE.all.length;i++){
      if(STICKER_STATE.all[i].creatorId===S.uid)source.push(STICKER_STATE.all[i]);
    }
  }

  if(!source.length){
    list.innerHTML='<div class="sticker-empty">Nenhum sticker nesta coleção.</div>';
    return;
  }

  for(i=0;i<source.length;i++){
    st=source[i];
    item=document.createElement('div'); item.className='sticker-item';
    b=document.createElement('button'); b.className='sticker-btn';
    img=document.createElement('img'); img.src=st.url; img.alt=st.name||"Sticker";
    b.appendChild(img);
    b.onclick=(function(obj){return function(){sendCustomSticker(obj);};})(st);
    item.appendChild(b);

    if(st.creatorName){
      owner=document.createElement('div'); owner.className='sticker-owner'; owner.innerHTML=esc(st.creatorName);
      item.appendChild(owner);
    }

    if(st.creatorId!==S.uid && !isSavedSticker(st.id)){
      save=document.createElement('button'); save.className='sticker-save'; save.innerHTML='Salvar';
      save.onclick=(function(id){return function(e){if(e&&e.stopPropagation)e.stopPropagation();saveSticker(id);};})(st.id);
      item.appendChild(save);
    }else if(st.creatorId!==S.uid){
      save=document.createElement('button'); save.className='sticker-save'; save.innerHTML='Salvo';
      save.onclick=function(e){if(e&&e.stopPropagation)e.stopPropagation();};
      item.appendChild(save);
    }
    list.appendChild(item);
  }
}

function requestNotify(){

function refreshToken(){
  if(!S.refresh)return;
  var u="https://securetoken.googleapis.com/v1/token?key="+encodeURIComponent(FIREBASE_API_KEY);
  var x=new XMLHttpRequest();
  x.open("POST",u,true);
  x.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status!==200){logout();return}
    var d;
    try{d=JSON.parse(x.responseText)}catch(e){logout();return}
    S.token=d.id_token;
    S.refresh=d.refresh_token||S.refresh;
    localStorage.chatT=S.token;
    localStorage.chatR=S.refresh;
  };
  x.send("grant_type=refresh_token&refresh_token="+encodeURIComponent(S.refresh));
}

function logout(){
  if(S.timer)clearInterval(S.timer);
  localStorage.removeItem("chatT");
  localStorage.removeItem("chatR");
  localStorage.removeItem("chatU");
  location.reload();
}

function setColors(bg, bubble){
  $('messages').style.backgroundColor = bg;
  $('customBubbleStyle').innerHTML = '.mine .bubble{ background-color: ' + bubble + ' !important; }';
}

function applySavedColors(){
  var bg = localStorage.chatBgColor || "#efe7dd";
  var bubble = localStorage.chatBubbleColor || "#dcf8c6";
  setColors(bg, bubble);
  $('bgColorPicker').value = bg;
  $('bubbleColorPicker').value = bubble;
}

$('bgColorPicker').onchange = function(){
  var bg = this.value;
  $('messages').style.backgroundColor = bg;
  localStorage.chatBgColor = bg;
};

$('bubbleColorPicker').onchange = function(){
  var bubble = this.value;
  $('customBubbleStyle').innerHTML = '.mine .bubble{ background-color: ' + bubble + ' !important; }';
  localStorage.chatBubbleColor = bubble;
};

$('text').addEventListener('focus', function(){
  hideEmojiPicker();
  hideStickerPicker();
  setTimeout(function(){
    window.scrollTo(0, 0);
    var box = $('messages');
    box.scrollTop = box.scrollHeight;
  }, 300);
});

$('text').oninput=function(){
  this.style.height='48px';
  var h=this.scrollHeight;
  if(h>96)h=96;
  if(h<48)h=48;
  this.style.height=h+'px';
};

$('loginBtn').onclick=login;
$('pass').onkeydown=function(e){if((e||window.event).keyCode===13)login()};
$('send').onclick=sendText;
$('text').onkeydown=function(e){
  e=e||window.event;
  if(e.keyCode===13 && !e.shiftKey){
    sendText();
    return false;
  }
};
$('photoBtn').onclick=function(){if(S.conv)$('file').click()};
$('file').onchange=function(){if(this.files&&this.files[0])uploadFile(this.files[0]);this.value=""};
$('micBtn').onclick=startRecord;
$('clearBtn').onclick=clearChat;
$('logout').onclick=logout;
document.body.addEventListener('click',requestNotify,{once:true});

try{
  if(localStorage.chatT&&localStorage.chatU&&USERS[localStorage.chatU]){
    S.token=localStorage.chatT;
    S.refresh=localStorage.chatR;
    S.uid=localStorage.chatU;
    openApp();
  }
}catch(e){}
</script>
</body>
</html>
